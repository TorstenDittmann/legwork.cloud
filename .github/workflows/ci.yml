name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: 1.3.14 }
      - run: bun install --frozen-lockfile
      - name: Restore workspace-utils build cache
        uses: actions/cache@v4
        with:
          path: .wsu
          key: wsu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-${{ github.sha }}
          restore-keys: |
            wsu-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('bun.lock') }}-
            wsu-${{ runner.os }}-${{ runner.arch }}-
      - run: bun run format:check
      - name: Ensure schema changes ship a generated migration
        run: |
          bun run db:generate
          if [ -n "$(git status --porcelain packages/db/migrations)" ]; then
            git status --porcelain packages/db/migrations
            echo "::error::Schema drift detected: run 'bun run db:generate' and commit the migration"
            exit 1
          fi
      - run: bun run check
      - run: bun run build
      - run: bun audit --audit-level=high
