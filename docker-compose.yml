services:
  libsql:
    image: ghcr.io/tursodatabase/libsql-server@sha256:07d5da358f37f7f327cc33c1cb5278e7892e04225f011a65a76049372a308982
    restart: unless-stopped
    environment:
      SQLD_NODE: primary
      SQLD_DB_PATH: /var/lib/sqld/data.db
    volumes:
      - libsql-data:/var/lib/sqld
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - libsql
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-http://libsql:8080}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "3000:3000"

  worker:
    build:
      context: .
      target: worker
    restart: unless-stopped
    depends_on:
      - libsql
      - web
    env_file:
      - path: .env
        required: false
    environment:
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: ${DATABASE_URL:-http://libsql:8080}
      DATABASE_AUTH_TOKEN: ${DATABASE_AUTH_TOKEN:-}
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
    # Microsandbox needs hardware virtualization on the worker host.
    devices:
      - /dev/kvm:/dev/kvm
    privileged: true

volumes:
  libsql-data:
